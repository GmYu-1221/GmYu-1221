<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="50" y1="20" x2="1130" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A16"/>
      <stop offset="0.52" stop-color="#10102A"/>
      <stop offset="1" stop-color="#071923"/>
    </linearGradient>
    <linearGradient id="neon" x1="310" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop stop-color="#7C3AED" stop-opacity=".38"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop stop-color="#06B6D4" stop-opacity=".3"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#67E8F9" stroke-opacity=".08"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="textGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="12" y="12" width="1176" height="406" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="12" y="12" width="1176" height="406" rx="30" fill="url(#bg)"/>
    <rect x="12" y="12" width="1176" height="406" fill="url(#grid)"/>
    <circle cx="250" cy="85" r="280" fill="url(#glowA)" filter="url(#blur)">
      <animate attributeName="cx" values="250;400;250" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="360" r="300" fill="url(#glowB)" filter="url(#blur)">
      <animate attributeName="cy" values="360;220;360" dur="12s" repeatCount="indefinite"/>
    </circle>

    <g opacity=".75">
      <circle cx="104" cy="82" r="2.5" fill="#22D3EE"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="104" r="2" fill="#F472B6"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1020" cy="318" r="3" fill="#A78BFA"><animate attributeName="opacity" values=".15;1;.15" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="165" cy="346" r="2" fill="#67E8F9"><animate attributeName="opacity" values="1;.15;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <path d="M65 145H215M985 260h150" stroke="url(#neon)" stroke-opacity=".35" stroke-width="1"/>
      <path d="M104 60v44M1094 82v44" stroke="#67E8F9" stroke-opacity=".35"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="600" y="100" fill="#67E8F9" font-size="16" letter-spacing="6" text-anchor="middle">HELLO, WORLD</text>
      <text x="600" y="214" fill="url(#neon)" font-size="78" font-weight="800" letter-spacing="2" text-anchor="middle" filter="url(#textGlow)">GMYU-1221</text>
      <text x="600" y="270" fill="#CBD5E1" font-size="21" letter-spacing="5" text-anchor="middle">BUILDING IDEAS INTO REALITY</text>
      <text x="600" y="328" fill="#94A3B8" font-size="15" text-anchor="middle">AI  /  AUTOMATION  /  CREATIVE CODE</text>
      <text x="72" y="390" fill="#22D3EE" font-size="12">● SYSTEM ONLINE</text>
      <text x="1127" y="390" fill="#A78BFA" font-size="12" text-anchor="end">SHANGHAI · UTC+8</text>
    </g>

    <rect x="12" y="12" width="1176" height="406" fill="none" stroke="url(#neon)" stroke-opacity=".45" stroke-width="2" rx="30"/>
    <rect x="12" y="12" width="1176" height="2" fill="url(#neon)" opacity=".8">
      <animate attributeName="y" values="12;416;12" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
