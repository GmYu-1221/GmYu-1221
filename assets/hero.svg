<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="20" x2="1080" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111820"/>
      <stop offset="1" stop-color="#18212A"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(875 30) rotate(135) scale(500 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4A77D" stop-opacity=".1"/>
      <stop offset="1" stop-color="#C4A77D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#CBD5E1" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="frame"><rect x="12" y="12" width="1176" height="336" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="12" y="12" width="1176" height="336" rx="18" fill="url(#bg)"/>
    <rect x="12" y="12" width="1176" height="336" fill="url(#grid)"/>
    <rect x="12" y="12" width="1176" height="336" fill="url(#light)"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="600" y="125" fill="#C4A77D" font-size="13" letter-spacing="5" text-anchor="middle">DESIGN · BUILD · REFINE</text>
      <text x="600" y="205" fill="#E5E7EB" font-size="60" font-weight="600" letter-spacing="4" text-anchor="middle">GmYu-1221</text>
      <line x1="475" y1="232" x2="725" y2="232" stroke="#C4A77D" stroke-opacity=".65"/>
      <text x="600" y="275" fill="#94A3B8" font-size="15" letter-spacing="3" text-anchor="middle">turning ideas into useful things</text>
    </g>

    <rect x="12.5" y="12.5" width="1175" height="335" fill="none" stroke="#CBD5E1" stroke-opacity=".12" rx="17.5"/>
  </g>
</svg>
